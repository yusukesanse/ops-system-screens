const RL=D.meta.roleLabels,PH=D.meta.phases,AR=D.areas;
const st={app:new Set(),ph:new Set(),role:new Set(),area:new Set(),q:'',view:'cards'};
function chips(id,items,key){const el=document.getElementById(id);el.innerHTML='';items.forEach(([k,v])=>{const c=document.createElement('span');c.className='chip';c.textContent=v;c.onclick=()=>{st[key].has(k)?st[key].delete(k):st[key].add(k);c.classList.toggle('on');render();};el.appendChild(c);});}
chips('fApp',D.apps.map(a=>[a.key,a.key==='S'?'LINE(S)':'管理(A)']),'app');
chips('fPh',Object.entries(PH).map(([k,v])=>[+k,'Ph'+k]),'ph');
chips('fRole',Object.entries(RL),'role');
chips('fArea',Object.entries(AR),'area');
document.getElementById('q').oninput=e=>{st.q=e.target.value.trim().toLowerCase();render();};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');st.view=b.dataset.view;render();});
function pass(s){if(st.app.size&&!st.app.has(s.app))return false;if(st.ph.size&&!st.ph.has(s.phase))return false;if(st.role.size&&![...st.role].some(r=>s.roles.includes(r)))return false;if(st.area.size&&!st.area.has(s.area))return false;if(st.q){const t=(s.id+' '+s.name+' '+s.purpose+' '+s.tables.join(' ')+' '+s.elements.join(' ')).toLowerCase();if(!t.includes(st.q))return false;}return true;}
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function card(s){return `<div class="card ${s.app}"><div class="id">${s.id} <span class="tag ph${s.phase}">Ph${s.phase}</span> <span class="tag">${esc(AR[s.area])}</span></div><h3>${esc(s.name)}</h3><p class="pur">${esc(s.purpose)}</p><ul>${s.elements.map(e=>'<li>'+esc(e)+'</li>').join('')}</ul><div class="tags">${s.roles.map(r=>'<span class="tag role">'+esc(RL[r])+'</span>').join('')}</div><div class="tags">${s.tables.map(t=>'<span class="tag tbl">'+esc(t)+'</span>').join('')}</div>${s.notes?'<div class="notes">'+esc(s.notes)+'</div>':''}</div>`;}
function render(){const list=D.screens.filter(pass);document.getElementById('count').textContent=list.length+' / '+D.screens.length+' 画面';const v=document.getElementById('view');
 if(st.view==='cards'){v.innerHTML=D.apps.map(a=>{const L=list.filter(s=>s.app===a.key);if(!L.length)return'';return `<section class="app"><h2>${esc(a.key)}: ${esc(a.name)}</h2><p class="note">${esc(a.note)}</p><div class="grid">${L.map(card).join('')}</div></section>`;}).join('');}
 else if(st.view==='table'){v.innerHTML=`<table><thead><tr><th>ID</th><th>画面</th><th>領域</th><th>Ph</th><th>ロール</th><th>目的</th><th>主な要素</th><th>テーブル</th><th>備考</th></tr></thead><tbody>${list.map(s=>`<tr><td><b>${s.id}</b></td><td>${esc(s.name)}</td><td>${esc(AR[s.area])}</td><td>${s.phase}</td><td>${s.roles.map(r=>RL[r]).join('・')}</td><td>${esc(s.purpose)}</td><td>${s.elements.map(esc).join('／')}</td><td>${s.tables.join(', ')}</td><td>${esc(s.notes)}</td></tr>`).join('')}</tbody></table>`;}
 else if(st.view==='matrix'){v.innerHTML=`<table class="matrix"><thead><tr><th>ID</th><th>画面</th>${Object.values(RL).map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${list.map(s=>`<tr><td><b>${s.id}</b></td><td>${esc(s.name)}</td>${Object.keys(RL).map(r=>'<td class="'+(s.roles.includes(r)?'ok':'')+'">'+(s.roles.includes(r)?'○':'')+'</td>').join('')}</tr>`).join('')}</tbody></table>`;}
 else{const m={};list.forEach(s=>s.tables.forEach(t=>(m[t]=m[t]||[]).push(s.id)));v.innerHTML=`<table><thead><tr><th>テーブル</th><th>使う画面</th></tr></thead><tbody>${Object.keys(m).sort().map(t=>`<tr><td><code>${t}</code></td><td>${m[t].join(', ')}</td></tr>`).join('')}</tbody></table>`;}
}
render();
